[tools]
# The Rust toolchain, installed through rustup.
rust = { version = "1.99.0", components = "rustfmt,clippy" }
# Checks the dependencies for security advisories, licenses and sources, see deny.toml.
"github:EmbarkStudios/cargo-deny" = "0.19.9"
# Lints the GitHub Actions workflows.
"github:rhysd/actionlint" = "1.7.7"

[tasks.lint]
description = "Check formatting, lints, the dependencies and the CI workflows"
run = [
  "cargo fmt --all --check",
  "cargo deny --locked check",
  "cargo clippy --locked --all-targets --all-features -- -D warnings",
  "actionlint",
]

[tasks.test]
description = "Run the tests, and evaluate the example migrations in every environment"
run = [
  "cargo test --locked --all-features",
  # Only evaluated: `verify` would need Docker for its throwaway server.
  "for env in dev staging prod; do for file in migrations/*.star; do cargo run --locked -q -- --env \"$env\" eval \"$file\" > /dev/null || exit 1; done; done",
]

[tasks.deny]
description = "Check the dependencies for security advisories, licenses and sources"
run = "cargo deny --locked check"

[tasks."release:bump"]
description = "Set the release version everywhere it is recorded, date the changelog, and commit it on the current branch, or from main on a release branch with a pull request of its own"
usage = 'arg "<version>" help="The new version, such as 1.3.0 or 1.3.0-rc.1"'
run = """
set -eu
version=${usage_version?}
echo "$version" | grep -Eq '^[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "Not a version: $version" >&2; exit 1; }
# The release commit should hold only the bump.
test -z "$(git status --porcelain)" || { echo "The working tree has uncommitted changes" >&2; git status --short >&2; exit 1; }
current=$(git branch --show-current)
test -n "$current" || { echo "Not on a branch" >&2; exit 1; }
# main takes changes only through pull requests, so on main the bump goes on a
# branch and pull request of its own. On any other branch it is committed
# there, to be merged with the rest of that branch's pull request.
if test "$current" = main; then
  git pull -q --ff-only
  branch=release/v$version
  git switch -q -c "$branch"
fi
# A release takes the changelog's Unreleased entries as its own; a prerelease
# leaves them for the release.
case "$version" in
*-*) ;;
*)
  awk '/^## Unreleased/ { f = 1; next } /^## / { f = 0 } f && NF' CHANGELOG.md | grep -q . ||
    { echo "CHANGELOG.md has nothing under ## Unreleased" >&2; exit 1; }
  perl -pi -e "s/^## Unreleased\\$/## Unreleased\\n\\n## $version - $(date -u +%Y-%m-%d)/" CHANGELOG.md
  ;;
esac
test "$(grep -c '^version = ' "Cargo.toml")" = 1
perl -pi -e "s/^version = \\"[^\\"]*\\"/version = \\"$version\\"/" "Cargo.toml"
cargo update -q --workspace
git commit -q -am "Release $version"
if test "$current" = main; then
  git push -q -u origin "$branch"
  gh pr create --base main --head "$branch" --title "Release $version" \\
    --body "Sets the version to $version. Once this is merged, run mise run release:tag on main to tag it, which starts the release."
  git switch -q main
fi
"""

[tasks."release:tag"]
description = "Tag main's merged release commit with its version and push the tag, which starts the release"
run = """
set -eu
test -z "$(git status --porcelain)" || { echo "The working tree has uncommitted changes" >&2; git status --short >&2; exit 1; }
test "$(git branch --show-current)" = main || { echo "Not on main" >&2; exit 1; }
git pull -q --ff-only
version=$(perl -ne 'print $1 if /^version = "(.*)"$/' Cargo.toml)
# Until the release pull request is merged, main still has the last release's
# version, which is already tagged.
if git ls-remote -q --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
  echo "v$version is already tagged; merge the release pull request first" >&2
  exit 1
fi
git tag -a "v$version" -m "iggy-migrate $version"
git push origin "v$version"
"""
