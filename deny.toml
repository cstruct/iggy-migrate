# What `cargo deny check` allows of the dependencies, run in CI.

[graph]
all-features = true

[advisories]
# Every advisory fails the check, unmaintained crates included, until it's fixed or
# listed here with why it doesn't apply.
version = 2
ignore = [
  # All through starlark-rust, with no release that drops them yet.
  { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill comes with starlark, through pagable" },
  { id = "RUSTSEC-2024-0388", reason = "derivative comes with starlark" },
  { id = "RUSTSEC-2025-0057", reason = "fxhash comes with starlark" },
  { id = "RUSTSEC-2024-0436", reason = "paste is only used at compile time, through starlark" },
]

[licenses]
version = 2
# Permissive licenses only.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

# iggy-migrate itself isn't published.
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# starlark-rust from git: 0.14.2 on crates.io pins blake3 =1.8.2, which iggy_common
# can't use, see Cargo.toml.
allow-git = ["https://github.com/facebook/starlark-rust"]
