[package]
name = "iggy-migrate"
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/cstruct/iggy-migrate"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
facet = "0.46.5"
humantime = "2.4.0"
iggy = "=0.11.0"
iggy_common = "=0.11.0"
ordna-core = "0.1.3"
ordna-source-env = "0.1.3"
ordna-source-styx = "0.1.3"
rustls = "0.23"
rustls-native-certs = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14.0"
# starlark 0.14.2 on crates.io pins blake3 =1.8.2, which conflicts with
# iggy_common's ^1.8.7. This upstream commit (2026-08-07) relaxes the pin;
# switch back to crates.io once a release includes it.
allocative = { version = "0.3.6", git = "https://github.com/facebook/starlark-rust", rev = "3bed1c40f93da22b8e251dd520dfb8d35bfe1fb7" }
starlark = { version = "0.14.2", git = "https://github.com/facebook/starlark-rust", rev = "3bed1c40f93da22b8e251dd520dfb8d35bfe1fb7" }
starlark_derive = { version = "0.14.2", git = "https://github.com/facebook/starlark-rust", rev = "3bed1c40f93da22b8e251dd520dfb8d35bfe1fb7" }
starlark_lsp = { version = "0.14.2", git = "https://github.com/facebook/starlark-rust", rev = "3bed1c40f93da22b8e251dd520dfb8d35bfe1fb7" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time"] }
