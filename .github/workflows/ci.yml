name: CI

# Not on pushes to main: pull requests are checked before they merge, and
# releases run this again on the tagged commit.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Rust, cargo-deny and actionlint, as pinned in mise.toml.
      - name: Install tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: Restore Cargo dependencies and build artifacts
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ci-${{ runner.os }}-${{ runner.arch }}-

      # Formatting, cargo-deny, clippy and actionlint.
      - name: Lint
        if: runner.os == 'Linux'
        run: mise run lint

      # The tests, and the example migrations evaluated in every environment.
      - name: Test
        run: mise run test

      # Not from releases: caches saved on a tag can only be read by that tag,
      # so they would just push out the ones pull requests use.
      - name: Save Cargo dependencies and build artifacts
        if: github.ref_type != 'tag' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # Builds on musl, as the static release binaries do, and checks the image
  # starts. Releases copy their own binaries into the image instead.
  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image from source
        run: docker build --target from-source -t iggy-migrate:ci .

      - name: Smoke test the image
        run: |
          docker run --rm iggy-migrate:ci --version
          docker run --rm --entrypoint docker iggy-migrate:ci --version
