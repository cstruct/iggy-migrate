name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Rust and cargo-deny, as pinned in mise.toml.
      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ci-${{ runner.os }}-${{ runner.arch }}-

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      # Security advisories, licenses and sources of the dependencies, by deny.toml.
      - name: Check dependencies
        if: runner.os == 'Linux'
        run: cargo deny --locked check

      - name: Lint
        if: runner.os == 'Linux'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-features

      # Only evaluated, in every environment: `verify` would need Docker for its
      # throwaway server.
      - name: Evaluate the example migrations
        if: runner.os == 'Linux'
        run: |
          for env in dev staging prod; do
            for file in migrations/*.star; do
              cargo run --locked -q -- --env "$env" eval "$file" > /dev/null
            done
          done

  # Builds on musl, as the static release binaries do, and checks the image
  # starts. Releases copy their own binaries into the image instead.
  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image from source
        run: docker build --target from-source -t iggy-migrate:ci .

      - name: Smoke test the image
        run: |
          docker run --rm iggy-migrate:ci --version
          docker run --rm --entrypoint docker iggy-migrate:ci --version
