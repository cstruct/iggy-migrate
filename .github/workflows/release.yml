name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag against Cargo.toml
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["version"]
          tag = os.environ["TAG_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"Release tag {tag!r} must match the package version v{version}")
          prerelease = "-" in version.split("+", 1)[0]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"prerelease={str(prerelease).lower()}", file=output)
          PY

  ci:
    name: Release checks
    needs: validate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.target }})
    needs: [validate, ci]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on 22.04, so the binaries run with glibc 2.35 and later, such as on
          # Debian 12 and Ubuntu 22.04.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          # Static, so they run on any Linux, Alpine included. The Docker image
          # runs them too.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    env:
      TARGET: ${{ matrix.target }}
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only Rust, as pinned in mise.toml, not cargo-deny.
      - name: Install Rust
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: rust

      # Restored only: a cache saved on a tag can only be read by that tag, so
      # it would just push out the ones pull requests use.
      - name: Restore Cargo dependencies and build artifacts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ hashFiles('mise.toml', 'Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            release-${{ matrix.target }}-

      # musl-gcc compiles the C in aws-lc and ring against musl's headers.
      - name: Install the musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q musl-tools
          rustup target add "$TARGET"
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --locked --release --bin iggy-migrate --target "$TARGET"

      - name: Smoke test release binary
        run: '"target/$TARGET/release/iggy-migrate" --version'

      - name: Check the musl binary is static
        if: endsWith(matrix.target, '-musl')
        run: file "target/$TARGET/release/iggy-migrate" | grep -E 'statically linked|static-pie linked'

      - name: Package binary
        run: |
          archive="iggy-migrate-$TAG_NAME-$TARGET"
          mkdir -p "dist/$archive"
          cp "target/$TARGET/release/iggy-migrate" README.md LICENSE CHANGELOG.md "dist/$archive/"
          tar -czf "dist/$archive.tar.gz" -C dist "$archive"

      - name: Upload release archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  docker:
    name: Publish Docker image
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      TAG_NAME: ${{ github.ref_name }}
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the musl release archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*-musl
          path: dist
          merge-multiple: true

      # The image's release target copies dist/<docker arch>/iggy-migrate.
      - name: Unpack the binaries
        run: |
          for arch in amd64:x86_64 arm64:aarch64; do
            archive="iggy-migrate-$TAG_NAME-${arch#*:}-unknown-linux-musl"
            mkdir -p "dist/${arch%%:*}"
            tar -xzf "dist/$archive.tar.gz" -C "dist/${arch%%:*}" --strip-components=1 "$archive/iggy-migrate"
          done

      - name: Smoke test the image
        run: |
          docker buildx create --use --driver docker-container
          docker buildx build --target release --platform linux/amd64 --load -t iggy-migrate:test .
          docker run --rm iggy-migrate:test --version
          docker run --rm --entrypoint docker iggy-migrate:test --version

      # A release also moves `<major>.<minor>` and `latest`; a prerelease doesn't.
      - name: Push the image to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          version="${TAG_NAME#v}"
          tags=(-t "$image:$version")
          if [[ "$PRERELEASE" != 'true' ]]; then
            tags+=(-t "$image:${version%.*}" -t "$image:latest")
          fi
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker buildx build --target release --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            "${tags[@]}" --push .

  publish:
    name: Publish GitHub release
    needs: [validate, build, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # For the release notes in CHANGELOG.md.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz > SHA256SUMS

      - name: Create release with binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          flags=()
          if [[ "$PRERELEASE" == 'true' ]]; then
            flags+=(--prerelease)
          fi
          # The version's changelog entries, which `mise run release:bump` dated;
          # a prerelease has none, so its notes come from the pull requests.
          awk -v heading="## ${TAG_NAME#v} " \
            'index($0, heading) == 1 { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md > notes.md
          image="Docker image: \`ghcr.io/${GH_REPO,,}:${TAG_NAME#v}\`, for linux/amd64 and linux/arm64."
          if grep -q . notes.md; then
            printf '\n%s\n' "$image" >> notes.md
            flags+=(--notes-file notes.md)
          else
            flags+=(--generate-notes --notes "$image")
          fi
          gh release create "$TAG_NAME" dist/* \
            --verify-tag --title "$TAG_NAME" "${flags[@]}"
